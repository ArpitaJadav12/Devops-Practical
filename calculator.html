
<h2>Simple Calculator</h2>

<input id="a" placeholder="First number">
<input id="b" placeholder="Second number">

<button onclick="add()">+</button>
<button onclick="sub()">-</button>

<p id="result"></p>

<script>
function add() {
    result.innerHTML = Number(a.value) + Number(b.value);
}

function sub() {
    result.innerHTML = Number(a.value) - Number(b.value);
}
</script>
